[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barelysmash-atlas-runtime"
version = "0.1.0-alpha.1"
description = "Host workload registry and runtime contracts for Atlas."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-m 'not integration' --cov=src/atlas_runtime --cov-report=term-missing --cov-fail-under=90"
markers = ["integration: touches the network or a live service"]
