[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barelysmash-atlas-memory"
version = "0.2.0-alpha.1"
description = "Organizational memory engine for Atlas."
requires-python = ">=3.11"
dependencies = ["barelysmash-atlas-core"]

[tool.pytest.ini_options]
pythonpath = ["src", "../atlas-core/src"]