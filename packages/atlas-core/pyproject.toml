[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barelysmash-atlas-core"
version = "0.2.0-alpha.1"
description = "Core shared models for Atlas."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-m 'not integration' --cov=src/atlas_core --cov-report=term-missing --cov-fail-under=70"
markers = ["integration: touches the network or a live service"]