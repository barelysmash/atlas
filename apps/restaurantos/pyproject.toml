[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barelysmash-restaurantos"
version = "0.3.0-alpha.1"
description = "RestaurantOS application built on Atlas."
requires-python = ">=3.11"
dependencies = ["barelysmash-atlas-core"]

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "../../packages/atlas-core/src"
]
addopts = "-m 'not integration' --cov=src/restaurantos --cov-report=term-missing --cov-fail-under=70"
markers = ["integration: touches the network or a live service"]