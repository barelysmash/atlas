schema_version: "1.0"

repository:
  name: "atlas"
  type: "engine"
  role: "Operational intelligence for BarelySmash: observes operational records, interprets them against declared goals, and emits Decisions."

jam:
  manual_version: "1.3.0"
  conformance_version: "1.0"

scaffold:
  template: "python-engine"
  version: "1.0.0"

python:
  layout: "monorepo"
  packages:
    - "packages/atlas-core"
    - "packages/atlas-events"
    - "packages/atlas-memory"
    - "packages/atlas-metrics"
    - "apps/restaurantos"
