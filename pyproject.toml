# Atlas is a monorepo of packages. This file carries the tool configuration
# that standards/python.md requires, at the repository root so that ruff and
# mypy resolve the same rules wherever they are run from. Package metadata
# stays in each packages/*/pyproject.toml.

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true
